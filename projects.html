<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB 취재 레이더 · 내 취재</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/app.css"><style>.project-list{display:grid;gap:9px}.project-card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.project-top{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.project-top h3{font-size:14px;margin:0;flex:1;min-width:260px}.project-meta{font-size:9px;color:#94a3b8}.state-badge,.judgment-badge{font-size:8.5px;font-weight:900;border-radius:99px;padding:3px 7px;background:#f1f5f9;color:#475569}.judgment-badge.기사화{background:#ecfdf5;color:#047857}.judgment-badge.추가취재{background:#fff7ed;color:#c2410c}.judgment-badge.보류{background:#eff6ff;color:#1d4ed8}.judgment-badge.폐기{background:#f1f5f9;color:#64748b}.project-signal{margin-top:8px;font-size:10.5px;line-height:1.55;color:#475569}.project-note{margin-top:9px}.project-note textarea{width:100%;min-height:74px;resize:vertical;border:1px solid #cbd5e1;border-radius:8px;padding:9px;font:inherit;font-size:10.5px;line-height:1.55}.project-details{margin-top:8px;border-top:1px solid #eef1f4;padding-top:7px}.project-details summary{cursor:pointer;font-size:9px;font-weight:850;color:#64748b}.project-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.project-box{border:1px solid #edf0f3;border-radius:8px;background:#fafbfc;padding:8px 9px}.project-box b{display:block;font-size:8px;color:#64748b;margin-bottom:4px}.project-box p,.project-box li{font-size:9.5px;line-height:1.5;color:#475569;margin:0}.project-box ul{margin:0;padding-left:17px}.project-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}.project-actions select{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:6px 8px;font-size:9.5px}.judge-btn{border:0;border-radius:8px;background:#172033;color:#fff;padding:7px 11px;font-size:9.5px;font-weight:900;cursor:pointer}.remove-btn{border:1px solid #e5e7eb;border-radius:8px;background:#fff;color:#64748b;padding:6px 9px;font-size:9px;cursor:pointer}.empty-projects{text-align:center;padding:48px 20px;color:#94a3b8}.empty-projects b{display:block;color:#475569;font-size:13px;margin-bottom:6px}@media(max-width:800px){.project-grid{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brandrow"><div class="brand"><div class="eyebrow">MARKETIN RESEARCH DESK</div><h1>IB 취재 레이더</h1><p>직접 취재하기로 고른 건만 관리합니다.</p></div><div class="status" id="status">—</div></div><nav class="nav"><a href="/">뉴스</a><a href="/dart.html">DART 공시</a><a href="/motae.html">출자공고</a><a href="/leads.html">AI 취재단서</a><a class="on" href="/projects.html">내 취재</a><a href="/judgment.html">기사판단기</a><a class="engine-link" href="https://article-engine-wjy-onejess.vercel.app/" target="_blank" rel="noopener">기사 엔진 ↗</a></nav></header><main class="page"><div class="page-head"><div class="page-title"><div class="kicker">REPORTING WORKBENCH</div><h2>내 취재</h2><p>통화·원문 확인 결과를 적고, 판단할 만큼 모이면 기사판단기로 넘깁니다.</p></div></div><div class="project-summary" id="summary"></div><div id="projects" class="project-list"></div><div class="footer">진행 상태와 메모는 현재 브라우저에 저장됩니다. 원문·누적 사실의 정본은 기존 취재 아카이브를 유지합니다.</div></main><script>const KEY='pef_my_reporting_projects_v1';let filter='ALL';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){return []}}function write(rows){localStorage.setItem(KEY,JSON.stringify(rows))}function list(items){return (items||[]).length?'<ul>'+items.slice(0,6).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>없음</p>'}function card(p){const c=p.clue||{},decision=p.judgment?.decision||'',state=p.status||'진행중';return '<article class="project-card" data-id="'+esc(p.project_id)+'"><div class="project-top"><h3>'+esc(p.title)+'</h3><span class="state-badge">'+esc(state)+'</span>'+(decision?'<span class="judgment-badge '+esc(decision)+'">판단 '+esc(decision)+'</span>':'')+'<span class="project-meta">'+esc((p.updated_at||p.created_at||'').slice(0,10))+'</span></div><div class="project-signal">'+esc(c.one_line_signal||'—')+'</div><div class="project-note"><textarea data-note placeholder="통화 결과, 확인된 숫자, 반론, 추가 확인사항을 적으세요.">'+esc(p.notes||'')+'</textarea></div><details class="project-details"><summary>단서의 근거·미확인·질문 보기</summary><div class="project-grid"><div class="project-box"><b>달라진 사실</b><p>'+esc(c.changed_fact||'—')+'</p></div><div class="project-box"><b>미확인 사항</b>'+list(c.unknowns)+'</div><div class="project-box"><b>확인할 질문</b>'+list(c.questions)+'</div></div></details><div class="project-actions"><select data-status>'+['진행중','답변대기','추가확인','판단대기','기사화','보류','폐기'].map(s=>'<option '+(state===s?'selected':'')+'>'+s+'</option>').join('')+'</select><button class="judge-btn" data-judge>'+(decision?'기사판단 다시 보기 →':'기사판단기로 보내기 →')+'</button><button class="remove-btn" data-remove>내 취재에서 빼기</button></div></article>'}function filtered(rows){return filter==='ALL'?rows:rows.filter(x=>(x.status||'진행중')===filter)}function renderSummary(rows){const defs=[['ALL','전체'],['진행중','진행중'],['답변대기','답변대기'],['추가확인','추가확인'],['판단대기','판단대기']];$('#summary').innerHTML=defs.map(([id,label])=>'<button class="'+(filter===id?'on':'')+'" data-filter="'+id+'">'+label+' '+(id==='ALL'?rows.length:rows.filter(x=>(x.status||'진행중')===id).length)+'</button>').join('')}function render(){const rows=read(),shown=filtered(rows);$('#status').textContent='내 취재 '+rows.length+'건';renderSummary(rows);$('#projects').innerHTML=shown.length?shown.map(card).join(''):'<div class="empty-projects"><b>이 상태의 취재가 없습니다.</b>AI 취재단서에서 ‘내 취재로 보내기’를 눌러 시작하세요.</div>'}document.addEventListener('input',e=>{const card=e.target.closest('[data-id]');if(!card)return;const rows=read(),p=rows.find(x=>x.project_id===card.dataset.id);if(!p)return;if(e.target.matches('[data-note]'))p.notes=e.target.value;if(e.target.matches('[data-status]'))p.status=e.target.value;p.updated_at=new Date().toISOString();write(rows)});document.addEventListener('change',e=>{if(e.target.matches('[data-status]')){e.target.dispatchEvent(new Event('input',{bubbles:true}));render()}});document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){filter=f.dataset.filter;render();return}const card=e.target.closest('[data-id]');if(!card)return;const id=card.dataset.id;if(e.target.matches('[data-judge]')){const rows=read(),p=rows.find(x=>x.project_id===id);if(p){p.status='판단대기';p.updated_at=new Date().toISOString();write(rows)}localStorage.setItem('pef_selected_project_v1',id);location.href='/judgment.html?project='+encodeURIComponent(id)}if(e.target.matches('[data-remove]')){write(read().filter(x=>x.project_id!==id));render()}});render();</script></body></html>
