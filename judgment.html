<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IB 취재 레이더 · 기사판단기</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="/app.css"><style>.judge-wrap{display:grid;gap:10px}.judge-panel{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.judge-panel h3{font-size:12px;margin:0 0 8px}.project-title{font-size:16px;font-weight:900;letter-spacing:-.03em}.project-signal{font-size:10.5px;line-height:1.55;color:#475569;margin-top:5px}.evidence-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:9px}.evidence-box{border:1px solid #edf0f3;border-radius:8px;background:#fafbfc;padding:8px 9px}.evidence-box b{display:block;font-size:8px;color:#64748b;margin-bottom:4px}.evidence-box p,.evidence-box li{font-size:9.5px;line-height:1.5;color:#475569;margin:0}.evidence-box ul{margin:0;padding-left:17px}.claim-input,.reason-input{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:9px;font:inherit;font-size:10.5px;line-height:1.5}.claim-input{min-height:64px}.reason-input{min-height:72px}.checklist{display:grid;gap:6px}.check-item{display:flex;gap:7px;align-items:flex-start;border:1px solid #e5e7eb;border-radius:8px;padding:7px 8px;background:#fff}.check-item input{margin-top:2px}.check-item b{display:block;font-size:9.5px;color:#172033}.check-item span span{display:block;font-size:8.5px;line-height:1.4;color:#64748b;margin-top:2px}.special-checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:7px}.special-checks .check-item{background:#fafbfc}.run-btn{width:100%;border:0;border-radius:8px;background:#172033;color:#fff;padding:8px 12px;font-size:9.5px;font-weight:900;cursor:pointer;margin-top:8px}.result{border-radius:10px;padding:11px 12px;border:1px solid #e5e7eb;background:#f8fafc}.result h4{margin:0 0 4px;font-size:15px}.result p{margin:0;font-size:9.5px;line-height:1.5;color:#475569}.result.기사화{background:#ecfdf5;border-color:#a7f3d0}.result.추가취재{background:#fff7ed;border-color:#fed7aa}.result.보류{background:#eff6ff;border-color:#bfdbfe}.result.폐기{background:#f8fafc;border-color:#cbd5e1}.decision-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.decision-btn{border:1px solid #cbd5e1;border-radius:8px;background:#fff;padding:6px 9px;font-size:9px;font-weight:850;cursor:pointer}.engine-ready{display:inline-block;text-decoration:none;border-radius:8px;background:#e84691;color:#fff;padding:7px 10px;font-size:9.5px;font-weight:900}.engine-ready[hidden]{display:none}.empty-judge{text-align:center;padding:46px 20px;color:#94a3b8}.empty-judge b{display:block;font-size:13px;color:#475569;margin-bottom:6px}.history{display:grid;gap:6px;margin-top:7px}.history-row{border-top:1px solid #eef1f4;padding-top:6px;font-size:9px;line-height:1.45;color:#64748b}.history-row b{color:#172033}.history-details{margin-top:8px}.history-details summary{cursor:pointer;font-size:9px;font-weight:850;color:#64748b}@media(max-width:760px){.evidence-grid,.special-checks{grid-template-columns:1fr}}</style></head><body><header class="topbar"><div class="brandrow"><div class="brand"><div class="eyebrow">MARKETIN RESEARCH DESK</div><h1>IB 취재 레이더</h1><p>취재한 건을 기사로 쓸 만큼 확인했는지만 판단합니다.</p></div><div class="status" id="status">—</div></div><nav class="nav"><a href="/">뉴스</a><a href="/dart.html">DART 공시</a><a href="/motae.html">출자공고</a><a href="/leads.html">AI 취재단서</a><a href="/projects.html">내 취재</a><a class="on" href="/judgment.html">기사판단기</a><a class="engine-link" href="https://article-engine-wjy-onejess.vercel.app/" target="_blank" rel="noopener">기사 엔진 ↗</a></nav></header><main class="page"><div class="page-head"><div class="page-title"><div class="kicker">STORY JUDGMENT</div><h2>기사판단기</h2><p>선택한 취재 한 건의 근거를 점검하고 기사화·추가취재·보류·폐기 중 하나로 결정합니다.</p></div></div><div id="judgeRoot" class="judge-wrap"><div class="empty-judge"><b>판단할 취재 건이 없습니다.</b>내 취재에서 ‘기사판단기로 보내기’를 눌러주세요.</div></div><div class="footer">점수나 자동 기사등급은 쓰지 않습니다. 자동 결과는 제안일 뿐이고 최종 결정은 기자가 확정합니다.</div></main><script>const KEY='pef_my_reporting_projects_v1',SEL='pef_selected_project_v1';const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));function read(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){return []}}function write(rows){localStorage.setItem(KEY,JSON.stringify(rows))}function list(items){return (items||[]).length?'<ul>'+items.slice(0,7).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'<p>없음</p>'}function getProject(){const id=new URLSearchParams(location.search).get('project')||localStorage.getItem(SEL);return read().find(x=>x.project_id===id)}function checked(id){return !!document.getElementById(id)?.checked}function state(){return{new_fact:checked('cNew'),primary:checked('cPrimary'),numbers:checked('cNumbers'),party:checked('cParty'),counter:checked('cCounter'),falsification:checked('cFalsification'),wait:checked('cWait'),broken:checked('cBroken')}}function suggest(s){if(s.broken)return{decision:'폐기',reason:'확인 결과 최초 가설이 깨졌거나 새로운 사실이 성립하지 않습니다.'};if(s.wait)return{decision:'보류',reason:'다음 공시·선정·결성·거래 종결 등 후속 사건이 있어야 판단할 수 있습니다.'};const miss=[];if(!s.new_fact)miss.push('새 사실·의미');if(!s.primary)miss.push('확인 근거');if(!s.numbers)miss.push('핵심 수치·조건');if(!s.party)miss.push('당사자 확인');if(!s.counter)miss.push('반론');if(!s.falsification)miss.push('반증 검토');return miss.length?{decision:'추가취재',reason:'아직 '+miss.join(' · ')+'이 부족합니다.'}:{decision:'기사화',reason:'새 사실과 핵심 근거, 당사자 확인, 반론과 반증 검토가 모두 채워졌습니다.'}}function check(id,title,desc,value){return '<label class="check-item"><input id="'+id+'" type="checkbox" '+(value?'checked':'')+'><span><b>'+title+'</b><span>'+desc+'</span></span></label>'}function render(){const p=getProject();if(!p)return;const c=p.clue||{},j=p.judgment||{},h=p.judgment_history||[];$('#status').textContent=j.decision?'최근 판단 · '+j.decision:'판단 대기';$('#judgeRoot').innerHTML='<div class="judgment-layout"><div><section class="judge-panel"><h3>취재 근거</h3><div class="project-title">'+esc(p.title)+'</div><div class="project-signal">'+esc(c.one_line_signal||'')+'</div><div class="evidence-grid"><div class="evidence-box"><b>달라진 사실</b><p>'+esc(c.changed_fact||'—')+'</p></div><div class="evidence-box"><b>내 취재 메모</b><p>'+esc(p.notes||'아직 메모가 없습니다.')+'</p></div><div class="evidence-box"><b>확인된 사실</b>'+list(c.confirmed_facts)+'</div><div class="evidence-box"><b>미확인 사항</b>'+list(c.unknowns)+'</div><div class="evidence-box"><b>취재 가설</b><p>'+esc(c.hypothesis||'—')+'</p></div><div class="evidence-box"><b>반증 조건</b><p>'+esc(c.falsification||'—')+'</p></div></div></section><details class="history-details"><summary>판단 이력 '+h.length+'건</summary><div class="history">'+(h.length?h.slice().reverse().map(x=>'<div class="history-row"><b>'+esc(x.decision)+'</b> · '+esc((x.at||'').replace('T',' ').slice(0,16))+'<br>'+esc(x.reason||'')+'</div>').join(''):'<div class="history-row">아직 판단 이력이 없습니다.</div>')+'</div></details></div><div><section class="judge-panel"><h3>핵심 주장</h3><textarea id="claim" class="claim-input" placeholder="기사로 확인하려는 핵심 주장을 한 문장으로 적으세요.">'+esc(j.claim||'')+'</textarea></section><section class="judge-panel" style="margin-top:10px"><h3>기사화에 필요한 확인</h3><div class="checklist">'+check('cNew','새로운 사실·의미','기존 보도의 반복이 아니라 새 사실 또는 새 의미가 있다',j.checklist?.new_fact)+check('cPrimary','공식 원문·직접취재 근거','핵심 주장에 쓸 근거가 확인 상태다',j.checklist?.primary)+check('cNumbers','핵심 수치·조건','금액·지분·일정·약정 등 핵심 숫자를 확인했다',j.checklist?.numbers)+check('cParty','당사자 확인','핵심 당사자에게 직접 확인했다',j.checklist?.party)+check('cCounter','반론·반대 설명','이해관계자의 반론 또는 반대 사례를 확인했다',j.checklist?.counter)+check('cFalsification','반증 조건 검토','가설이 틀릴 수 있는 조건을 실제 자료와 대조했다',j.checklist?.falsification)+'</div><div class="special-checks">'+check('cWait','다음 사건 대기','후속 사건이 있어야 판단 가능',j.checklist?.wait)+check('cBroken','가설 깨짐','확인 결과 단서가 성립하지 않음',j.checklist?.broken)+'</div><button id="run" class="run-btn">현재 상태로 판단</button></section><section class="judge-panel" style="margin-top:10px"><h3>판단</h3><div id="result" class="result '+esc(j.decision||'')+'">'+(j.decision?'<h4>'+esc(j.decision)+'</h4><p>'+esc(j.reason||'')+'</p>':'<h4>판단 전</h4><p>확인 상태를 체크하고 판단을 실행하세요.</p>')+'</div><div class="decision-actions"><button class="decision-btn" data-decision="기사화">기사화</button><button class="decision-btn" data-decision="추가취재">추가취재</button><button class="decision-btn" data-decision="보류">보류</button><button class="decision-btn" data-decision="폐기">폐기</button><a class="engine-ready" href="https://article-engine-wjy-onejess.vercel.app/" target="_blank" rel="noopener" '+(j.decision==='기사화'?'':'hidden')+'>기사 엔진 ↗</a></div><textarea id="reason" class="reason-input" style="margin-top:8px" placeholder="판단 이유를 수정할 수 있습니다.">'+esc(j.reason||'')+'</textarea></section></div></div>';$('#run').onclick=()=>{const s=state(),r=suggest(s);save(r.decision,r.reason,s)};document.querySelectorAll('[data-decision]').forEach(b=>b.onclick=()=>save(b.dataset.decision));}function save(decision,autoReason,s){const p=getProject();if(!p)return;const rows=read(),t=rows.find(x=>x.project_id===p.project_id);if(!t)return;const at=new Date().toISOString(),claim=$('#claim')?.value.trim()||'',reason=autoReason||$('#reason')?.value.trim()||'기자가 직접 판단을 확정했습니다.',checklist=s||state();t.judgment={decision,reason,claim,checklist,at};t.judgment_history=t.judgment_history||[];t.judgment_history.push({decision,reason,claim,checklist,at});t.status=decision==='추가취재'?'추가확인':decision;t.updated_at=at;write(rows);render()}render();</script></body></html>
